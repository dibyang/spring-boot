plugins {
	id "base"
	id "org.jetbrains.kotlin.jvm" apply false // https://youtrack.jetbrains.com/issue/KT-30276
	id "io.spring.nohttp" version "0.0.11"
}

description = "Spring Boot Build"

defaultTasks 'build'

nohttp {
	allowlistFile = project.file("src/nohttp/allowlist.lines")
	source.exclude "**/bin/**"
	source.exclude "**/build/**"
	source.exclude "**/out/**"
	source.exclude "**/target/**"
	source.exclude "**/.settings/**"
	source.exclude "**/.classpath"
	source.exclude "**/.project"
	source.exclude "spring-boot-project/spring-boot-tools/spring-boot-buildpack-platform/src/test/resources/org/springframework/boot/buildpack/platform/docker/export.tar"
}

check {
	dependsOn checkstyleNohttp
}


allprojects {
	group "net.xdob.springframework.boot"

	repositories {
		mavenCentral()
		maven { url 'https://maven.aliyun.com/repository/public/' }
		if (version.contains('-')) {
			maven { url "https://repo.spring.io/milestone" }
		}
		if (version.endsWith('-SNAPSHOT')) {
			maven { url "https://repo.spring.io/snapshot" }
		}
	}

	configurations.all {
		resolutionStrategy.cacheChangingModulesFor 0, "minutes"
	}
}

tasks.named("checkstyleNohttp").configure {
	maxHeapSize = "1536m"
}

subprojects {
	afterEvaluate {
		// 确保应用 java 或 java-library 插件
		if (plugins.hasPlugin('java') || plugins.hasPlugin('java-library')) {
			test {
				enabled = false
			}
		}
		if (plugins.hasPlugin('org.springframework.boot.starter') ) {
			checkRuntimeClasspathForUnnecessaryExclusions{
				enabled = false
			}
		}
		if (plugins.hasPlugin('org.springframework.boot.integration-test') ) {
			intTest{
				enabled = false
			}
		}

	}

}